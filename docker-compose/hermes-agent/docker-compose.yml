services:
  hermes:
    image: nousresearch/hermes-agent:v2026.8.31@sha256:64923faeae267792bf9bf87fe3b4c4869e35004e360c7df01730ad801b74d524
    restart: unless-stopped

    command: ["gateway", "run"]

    # Only the application's own secrets. DOMAIN lives in .env and is used for
    # Compose interpolation only, so it is never injected into the agent's
    # environment.
    env_file:
      - app.env

    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"

    # Hardening
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 500
    tmpfs:
      - /tmp
      - /run

    volumes:
      - hermes-data:/opt/data

      # nginx' document root, read-write here and read-only there, so the agent
      # can publish sites into it. Same path on both sides of the mount: a path
      # the agent reports is the path you find on the host. This is the only
      # host directory it gets — the Compose files and Traefik's dynamic config
      # stay out of reach, so it can write content but not routing or TLS.
      - /opt/site:/opt/site

    # Dedicated network: the dashboard listens on 0.0.0.0:9119, so sharing a
    # network with other backends would let them reach it directly.
    networks:
      - proxy-hermes

    # Resources
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "0.5"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      # 127.0.0.1 rather than localhost: the dashboard binds 0.0.0.0 (IPv4), so
      # a localhost lookup can resolve to ::1 first and fail.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9119/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-hermes"

      # Dashboard
      - "traefik.http.routers.hermes.rule=Host(`hermes.${DOMAIN}`)"
      - "traefik.http.routers.hermes.entrypoints=websecure"
      - "traefik.http.routers.hermes.tls=true"
      - "traefik.http.routers.hermes.tls.certresolver=letsencrypt"

      - "traefik.http.services.hermes.loadbalancer.server.port=9119"

      # This dashboard holds API keys. If you only reach it from a fixed network
      # or a VPN, add an ipAllowList middleware.
      - "traefik.http.routers.hermes.middlewares=security-headers@file"

volumes:
  hermes-data:
    name: hermes-data

networks:
  proxy-hermes:
    external: true
