services:
  hermes:
    image: nousresearch/hermes-agent:v2026.9.7@sha256:63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7
    restart: unless-stopped

    command: ["gateway", "run"]

    # Only the application's own secrets. DOMAIN lives in .env and is used for
    # Compose interpolation only, so it is never injected into the agent's
    # environment.
    env_file:
      - app.env

    environment:
      # Fixed container path; HERMES_DATA_ROOT selects only the host location.
      HERMES_DATA_DIR: /opt/data
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"

    volumes:
      # Private state: never mount this directory in nginx or inside SITE_ROOT.
      - type: bind
        source: ${HERMES_DATA_ROOT:-../../data/hermes}
        target: /opt/data
        read_only: false
        bind:
          create_host_path: false

      # Host folder configured with SITE_ROOT, writable only by Hermes.
      # Inside the container the publishing path remains /opt/site.
      # Compose files, routing and TLS configuration are not mounted.
      - type: bind
        source: ${SITE_ROOT:-../../data/site}
        target: /opt/site
        read_only: false
        bind:
          create_host_path: false

    # Dedicated network: the dashboard listens on 0.0.0.0:9119, so sharing a
    # network with other backends would let them reach it directly.
    networks:
      - proxy-hermes

    # Resources
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "0.5"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-hermes"

      # Dashboard
      - "traefik.http.routers.hermes.rule=Host(`hermes.${DOMAIN}`)"
      - "traefik.http.routers.hermes.entrypoints=websecure"
      - "traefik.http.routers.hermes.tls=true"
      - "traefik.http.routers.hermes.tls.certresolver=letsencrypt"

      - "traefik.http.services.hermes.loadbalancer.server.port=9119"

      # This dashboard holds API keys. If you only reach it from a fixed network
      # or a VPN, add an ipAllowList middleware.
      - "traefik.http.routers.hermes.middlewares=security-headers@file"

networks:
  proxy-hermes:
    external: true
