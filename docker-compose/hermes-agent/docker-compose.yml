services:
  hermes:
    image: nousresearch/hermes-agent:v2026.8.31
    container_name: hermes
    restart: unless-stopped

    command: ["gateway", "run"]

    # Only the application's own secrets. DOMAIN and HERMES_BASIC_AUTH_USERS
    # live in .env and are used for Compose interpolation only, so the bcrypt
    # hash is never injected into the agent's environment.
    env_file:
      - app.env

    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"

    # Hardening
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 500
    tmpfs:
      - /tmp
      - /run

    volumes:
      - hermes-data:/opt/data

      # nginx' document root, read-write here and read-only there, so the agent
      # can publish sites into it. Same path on both sides of the mount: a path
      # the agent reports is the path you find on the host. This is the only
      # host directory it gets — the Compose files and Traefik's dynamic config
      # stay out of reach, so it can write content but not routing or TLS.
      - /opt/site:/opt/site

    # Dedicated network: the dashboard listens on 0.0.0.0:9119, so sharing a
    # network with other backends would let them reach it directly and skip the
    # BasicAuth middleware.
    networks:
      - proxy-hermes

    # Resources
    mem_limit: 1g
    memswap_limit: 1g
    cpus: "0.5"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      # 127.0.0.1 rather than localhost: the dashboard binds 0.0.0.0 (IPv4), so
      # a localhost lookup can resolve to ::1 first and fail.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9119/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-hermes"

      # Dashboard
      - "traefik.http.routers.hermes.rule=Host(`hermes.${DOMAIN}`)"
      - "traefik.http.routers.hermes.entrypoints=websecure"
      - "traefik.http.routers.hermes.tls=true"
      - "traefik.http.routers.hermes.tls.certresolver=letsencrypt"

      - "traefik.http.services.hermes.loadbalancer.server.port=9119"

      # Order is outermost -> innermost. Headers first so they are also applied
      # to 401 responses, then the rate limit, so brute-force attempts are
      # throttled before any credentials are checked. This dashboard holds API
      # keys: if you can reach it from a fixed network or a VPN, add
      # trusted-ips@file to the front of this chain (see
      # ../traefik/dynamic/security.yml).
      - "traefik.http.routers.hermes.middlewares=security-headers@file,auth-ratelimit@file,hermes-auth"
      - "traefik.http.middlewares.hermes-auth.basicauth.users=${HERMES_BASIC_AUTH_USERS}"

volumes:
  hermes-data:
    name: hermes-data

networks:
  proxy-hermes:
    external: true
