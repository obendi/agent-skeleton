services:
  web:
    # Pinned by digest. 1.27 is an unmaintained branch; 1.30.x is current stable.
    image: nginx:1.30.4-alpine@sha256:dc5069ad14f19660b141b21236140b91656bf89bbc3e2417c70ae650cd66104c
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The master process starts as root and drops to the nginx user, so it
      # needs these four. Switching to nginxinc/nginx-unprivileged would let you
      # drop them all, at the cost of listening on :8080 instead of :80.
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    pids_limit: 100
    volumes:
      # Written by the agent, served here. One subdirectory per site, so
      # /opt/site/blog is served at https://${DOMAIN}/blog/. Read-only: nginx
      # never needs to write to it, and the mount is the agent's blast radius.
      - /opt/site:/usr/share/nginx/html:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

    # Resources
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.25"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      # 127.0.0.1, not localhost: read_only stops the image's
      # 10-listen-on-ipv6-by-default.sh from adding the IPv6 listen directive,
      # so nginx is IPv4-only while localhost resolves to ::1 first. Using
      # localhost here leaves the container permanently unhealthy.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy-web"
      - "traefik.http.routers.web.rule=Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=80"

      # Order is outermost -> innermost. Headers first so they are also applied
      # to 401 responses, then the rate limit, so throttling happens before any
      # credentials are checked.
      - "traefik.http.routers.web.middlewares=security-headers@file,auth-ratelimit@file,nginx-auth"
      - "traefik.http.middlewares.nginx-auth.basicauth.users=${NGINX_BASIC_AUTH_USERS}"
    networks:
      - proxy-web

networks:
  proxy-web:
    external: true
