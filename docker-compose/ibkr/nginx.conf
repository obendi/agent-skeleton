pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;
events { worker_connections 128; }
http {
  access_log off;
  client_body_temp_path /tmp/nginx/body;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;
  proxy_temp_path /tmp/nginx/proxy;
  server {
    listen 8080;
    location = /health { return 200 'ok'; }
    # No trading, account changes, login, cookies or arbitrary proxy paths.
    location ~ ^/v1/api/portfolio/(accounts|[A-Za-z0-9]+/positions/[0-9]+)$ {
      limit_except GET { deny all; }
      proxy_pass https://127.0.0.1:5000;
      proxy_set_header Host localhost:5000;
      proxy_set_header Cookie "";
      proxy_set_header Authorization "";
      proxy_set_header Origin "";
      proxy_set_header Referer "";
      proxy_set_header X-Forwarded-For "";
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /state/localhost.crt;
      proxy_ssl_name localhost;
      proxy_ssl_server_name on;
      proxy_connect_timeout 5s;
      proxy_read_timeout 20s;
      proxy_hide_header Set-Cookie;
    }
    location / { return 403; }
  }
}
