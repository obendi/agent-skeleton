[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:gateway]
directory=/opt/gateway
command=/bin/bash bin/run.sh root/conf.yaml
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1440x900x24 -nolisten tcp
priority=10
autorestart=true

[program:desktop]
command=/usr/bin/openbox
priority=20
autorestart=true
startsecs=0

[program:vnc]
command=/usr/bin/x11vnc -display :99 -rfbport 5900 -localhost -rfbauth /tmp/vnc-password -forever -shared -noxdamage
priority=30
autorestart=true
startsecs=0

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc/ 6080 127.0.0.1:5900
autorestart=true

[program:browser]
command=/usr/local/bin/browser.sh
autorestart=true
stopasgroup=true
killasgroup=true

[program:bridge]
command=/usr/sbin/nginx -c /etc/ibkr/nginx.conf -g "daemon off;"
autorestart=true

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock
