ip2loc: "US"
proxyRemoteSsl: true
proxyRemoteHost: "https://api.ibkr.com"
listenPort: 5000
listenSsl: true
ccp: false
svcEnvironment: "v1"
sslCert: "/state/localhost.jks"
sslPwd: "local-keystore"
authDelay: 3000
portalBaseURL: ""
serverOptions:
  blockedThreadCheckInterval: 1000000
  eventLoopPoolSize: 4
  workerPoolSize: 4
  maxWorkerExecuteTime: 100
  internalBlockingPoolSize: 4
cors:
  origin.allowed: "https://localhost:5000"
  allowCredentials: false
webApps:
  - name: "demo"
    index: "index.html"
ips:
  allow:
    - 127.0.0.1
  deny: []
