services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: webapp
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: webapp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - app-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webapp"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  app-dev-db:
