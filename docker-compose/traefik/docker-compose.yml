services:
  # Read-only Docker API proxy. Traefik never touches /var/run/docker.sock
  # directly: mounting the socket with :ro does NOT prevent write calls to the
  # API, so a compromised Traefik would be able to start a privileged container
  # and take over the host. This proxy only forwards the endpoints the Docker
  # provider needs, and blocks every POST.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    restart: unless-stopped

    environment:
      # Allowed (required by Traefik's Docker provider)
      CONTAINERS: 1
      NETWORKS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      # Denied
      POST: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EXEC: 0
      IMAGES: 0
      INFO: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    # Hardening.
    # No read_only here: the entrypoint renders haproxy.cfg next to the
    # template it ships in /usr/local/etc/haproxy, so that path has to stay
    # writable. Writes land on the container's own ephemeral layer and the only
    # mount is the socket, itself read-only.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    tmpfs:
      - /run
      - /tmp
    pids_limit: 100

    # No route to the internet: this container is only reachable by Traefik.
    networks:
      - socket-proxy

    mem_limit: 64m
    memswap_limit: 64m
    cpus: "0.25"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  traefik:
    # Pinned by digest so a moved tag cannot silently change what runs.
    image: traefik:v3.7.12@sha256:9c2a54d87f76f5c2f5f2682c68394af92fb12c0a2686798d6462a3f84bd78eaf
    restart: unless-stopped
    depends_on:
      - socket-proxy

    # Bridge networking rather than host: Traefik reaches the API proxy over an
    # internal network, so nothing extra is bound on the host. Published ports
    # still preserve the client IP through DNAT.
    ports:
      - "80:80"
      - "443:443"

    command:
      - --api.dashboard=false
      - --api.insecure=false
      - --log.level=INFO
      - --global.checknewversion=false
      - --global.sendanonymoususage=false

      # Access logs leave a trail of who requested what. Headers are dropped to
      # keep Authorization/Cookie values out of the logs.
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.fields.headers.defaultmode=drop

      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.endpoint=tcp://socket-proxy:2375

      # TLS options and shared middlewares (see ./dynamic)
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true

      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      # Health endpoint on a container-local entrypoint: not published, so it is
      # not reachable from the internet.
      - --entrypoints.ping.address=127.0.0.1:8082
      - --ping=true
      - --ping.entrypoint=ping

      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # Uncomment while testing to avoid hitting Let's Encrypt rate limits:
      # - --certificatesresolvers.letsencrypt.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory

      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

    volumes:
      - traefik-letsencrypt:/letsencrypt
      - ./dynamic:/etc/traefik/dynamic:ro

    # Hardening
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Only capability needed to bind :80 and :443
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
    pids_limit: 200

    networks:
      - socket-proxy
      - proxy-web
      - proxy-hermes

    # Resources
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.5"

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8082/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  traefik-letsencrypt:
    name: traefik-letsencrypt

networks:
  # Private to this stack, no internet access.
  socket-proxy:
    name: socket-proxy
    internal: true

  # One network per backend, so a compromised container cannot reach another
  # service directly and bypass Traefik's middlewares.
  proxy-web:
    external: true
  proxy-hermes:
    external: true
